<!doctype html>

<style>
  @font-face { font-family: Inter; src: url(inter.woff2) format("woff2"); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; display: flex; align-items: center; gap: 64px; padding: 72px; font-family: Inter;
         background: linear-gradient(110deg, #082c38 0%, #134c52 65%, #196f66 100%); color: #fff; }
  .copy { flex: 1; display: flex; flex-direction: column; gap: 28px; }
  .badge { align-self: flex-start; padding: 8px 16px; border-radius: 999px; background: #c8ebe8; color: #196f66; font: 600 20px Inter; text-transform: uppercase; }
  h1 { font: 400 76px/1.04 Inter; }
  h1 span { color: #a8d8ce; }
  p { font-size: 28px; color: #c3d9da; }
  .photo { position: relative; width: 360px; height: 360px; border-radius: 32px; overflow: hidden; border: 12px solid #c8ebe8; }
  .photo img { position: absolute; top: 0; left: -27%; width: 154%; }
</style>
